[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-universal-voice"
version = "1.0.0"
description = "Standalone PipeWire Linux real-time voice subsystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-genai==2.24.0", "numpy>=1.26,<3", "openwakeword==0.4.0", "onnxruntime>=1.16,<2", "vosk==0.3.45", "sounddevice>=0.5.1,<1", "jsonschema>=4.26,<5"]

[project.scripts]
universal-voice = "universal_voice.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "ATTRIBUTION.md"]

[tool.setuptools.packages.find]
include = ["universal_voice*"]

[tool.setuptools.package-data]
universal_voice = ["assets/*.pcm", "assets/*.json", "task-event-v1.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
