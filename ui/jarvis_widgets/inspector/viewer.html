<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JARVIS 3D Inspector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1118;
      color: #f2f5fa;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #header {
      position: absolute;
      top: 12px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(20, 32, 45, 0.85);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid #354a5e;
      backdrop-filter: blur(8px);
    }
    #header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
      color: #55ddea;
      letter-spacing: 0.5px;
    }
    #controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      background: rgba(20, 32, 45, 0.85);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #354a5e;
      backdrop-filter: blur(8px);
    }
    button {
      background: #1c2b3c;
      color: #f2f5fa;
      border: 1px solid #4a6075;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #273b52;
      border-color: #55ddea;
      color: #55ddea;
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <div id="header">
    <h1>JARVIS 3D Spatial Inspector</h1>
  </div>
  <div id="canvas-container">
    <model-viewer id="viewer" src="" camera-controls auto-rotate shadow-intensity="1" ar style="width: 100%; height: 100%;">
    </model-viewer>
  </div>
  <div id="controls">
    <button id="reset-view" onclick="document.getElementById('viewer').cameraOrbit = '0deg 75deg 105%'">Reset View</button>
    <button id="toggle-rotate" onclick="const v = document.getElementById('viewer'); v.autoRotate = !v.autoRotate;">Toggle Auto-Rotate</button>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const model = urlParams.get('model');
    if (model) {
      document.getElementById('viewer').src = model;
    }
  </script>
</body>
</html>
