[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-memory-mcp"
version = "0.1.0"
description = "Standalone local Universal Memory MCP service"
requires-python = ">=3.11"

[project.scripts]
universal-memory-mcp = "universal_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
