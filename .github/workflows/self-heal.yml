name: Autonomous CI Self-Healing Loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to self-heal"
        required: true
        default: "JARVIS-OS"
      test_cmd:
        description: "Test command to execute and heal"
        required: true
        default: "timeout 300 python -m pytest -q"
      max_attempts:
        description: "Max healing iterations"
        required: false
        default: "3"

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  self-heal:
    # Trigger when CI failed or manually dispatched
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine target branch
        id: branch_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_BRANCH="${{ github.event.inputs.branch }}"
            TEST_COMMAND="${{ github.event.inputs.test_cmd }}"
            MAX_ATTEMPTS="${{ github.event.inputs.max_attempts }}"
          else
            TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
            TEST_COMMAND="timeout 300 python -m pytest -q"
            MAX_ATTEMPTS="3"
          fi
          echo "branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT
          echo "test_cmd=${TEST_COMMAND}" >> $GITHUB_OUTPUT
          echo "max_attempts=${MAX_ATTEMPTS}" >> $GITHUB_OUTPUT
          echo "Self-healing target branch: ${TARGET_BRANCH}"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch_info.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev libsndfile1 alsa-utils libnotify-bin pulseaudio pulseaudio-utils pipewire-bin qrencode grim

      - name: Start dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute Autonomous Self-Healing Pipeline
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SELF_HEAL_AUTO_PUSH: "true"
        run: |
          python scripts/ci_self_heal.py \
            --test-cmd "${{ steps.branch_info.outputs.test_cmd }}" \
            --max-attempts ${{ steps.branch_info.outputs.max_attempts }} \
            --auto-push \
            --report ci-self-heal-loop-report.json

      - name: Preserve self-healing loop report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-self-heal-loop-report
          path: ci-self-heal-loop-report.json
