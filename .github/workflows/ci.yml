name: CI

on:
  push:
    branches: [ "main", "dev", "Harness²", "harness2", "JARVIS-OS" ]
  pull_request:
    branches: [ "main", "dev", "JARVIS-OS" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev libsndfile1 alsa-utils libnotify-bin pulseaudio pulseaudio-utils pipewire-bin qrencode grim

      - name: Start dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Required behavior gate with autonomous self-healing
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SELF_HEAL_AUTO_PUSH: "true"
          CI_SELF_HEAL_MAX_ATTEMPTS: "3"
        run: |
          python scripts/ci_self_heal.py \
            --test-cmd "python scripts/behavior_gate.py --report behavior-gate.json" \
            --max-attempts 3 \
            --report behavior-gate-self-heal.json

      - name: Preserve behavior gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-gate-python-${{ matrix.python-version }}
          path: behavior-gate.json

      - name: Run unit and regression tests with autonomous self-healing
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SELF_HEAL_AUTO_PUSH: "true"
          CI_SELF_HEAL_MAX_ATTEMPTS: "3"
        run: |
          python scripts/ci_self_heal.py \
            --test-cmd "timeout 300 python -m pytest -q" \
            --max-attempts 3 \
            --report ci-self-heal-report.json

      - name: Preserve self-healing report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-self-heal-report-python-${{ matrix.python-version }}
          path: ci-self-heal-report.json

      - name: Memory quality baseline comparison
        run: python scripts/evaluate_memory.py --baseline tests/fixtures/memory_quality/baseline.json --report memory-quality.json

      - name: Preserve memory quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-quality-python-${{ matrix.python-version }}
          path: memory-quality.json
