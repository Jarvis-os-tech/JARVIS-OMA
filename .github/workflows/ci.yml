name: CI

on:
  push:
    branches: [ "main", "dev", "Harness²", "harness2", "JARVIS-OS" ]
  pull_request:
    branches: [ "main", "dev", "JARVIS-OS" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev libsndfile1 alsa-utils libnotify-bin pulseaudio-utils pipewire-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and regression tests
        env:
          PYTHONPATH: .
        run: |
          timeout 300 python -m pytest -q
